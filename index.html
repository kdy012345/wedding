<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:title" content="이현성 ♥ 김다윤 결혼식에 초대합니다">
<meta property="og:description" content="2026년 8월 23일 일요일 오후 2시 · 메종드아나하">
<meta property="og:image" content="https://kdy012345.github.io/wedding/cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://kdy012345.github.io/wedding/">
<title>이현성 ❤️ 김다윤</title>

<link rel="preload" as="image" href="https://kdy012345.github.io/wedding/cover.jpg">

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script>
  if(typeof Kakao !== 'undefined' && !Kakao.isInitialized()){
    Kakao.init('e4664a7a38c753ac8b404b9a00de890a');
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&family=Special+Elite&display=swap" rel="stylesheet">

<style>
/* 기존 스타일 생략 (다윤님이 제공해주신 CSS가 여기에 들어갑니다) */
/* ... (중략) ... */
</style>
</head>
<body>

<div class="wrap">
    <section class="cover">
        <img src="https://kdy012345.github.io/wedding/cover.jpg" class="cover-single-img" alt="커버 이미지">
    </section>

    <section class="gallery-section-new">
        <div class="gallery-title-new">GALLERY</div>
        <div class="gallery-grid-wrap">
            <img src="5.webp" onclick="openLbox(0)" loading="lazy" alt="갤러리1">
            <img src="6.webp" onclick="openLbox(1)" loading="lazy" alt="갤러리2">
            <img src="3.webp" onclick="openLbox(2)" loading="lazy" alt="갤러리3">
            <img src="9.webp" onclick="openLbox(3)" loading="lazy" alt="갤러리4">
            <img src="10.webp" onclick="openLbox(4)" loading="lazy" alt="갤러리5">
            <img src="12.webp" onclick="openLbox(5)" loading="lazy" alt="갤러리6">
        </div>
    </section>

    <section class="map-section">
        <div class="map-addr-top">
            <div class="map-venue-name">메종드아나하</div>
            <div class="map-venue-addr">경기 화성시 남양읍 남양로 633</div>
            <a href="javascript:void(0);" onclick="openKakaoNavi()" class="map-kakaonavi-btn">
                <img src="https://developers.kakao.com/assets/img/about/logos/kakaonavi/kakaonavi_sharing_btn_small.png" width="20" alt="카카오내비">
                카카오내비로 오시는 길
            </a>
        </div>
    </section>
</div>

<div id="lbox" class="lbox" onclick="closeLbox()">
    <span class="lbox-x">&times;</span>
    <div class="lbox-img-wrap">
        <img id="lbox-img" src="" alt="확대 이미지">
    </div>
</div>

<script>
// [수정 2] 카카오내비 핀 위치 정밀 조정 (세 번째 사진 기준)
window.openKakaoNavi = function() {
  if (!window.Kakao) return;
  
  if (!Kakao.isInitialized()) {
    Kakao.init('e4664a7a38c753ac8b404b9a00de890a');
  }

  Kakao.Navi.share({
    name: '메종드아나하',
    x: 127.067341, // 경도
    y: 37.288258,  // 위도 (KT플라자 위쪽 정문 위치)
    coordType: 'wgs84'
  });
};

// [최적화 3] 갤러리 라이트박스 메모리 관리
function openLbox(idx) {
    const imgs = ["5.webp", "6.webp", "3.webp", "9.webp", "10.webp", "12.webp"];
    const lbox = document.getElementById('lbox');
    const lboxImg = document.getElementById('lbox-img');
    
    // 클릭한 시점에만 고화질 이미지 로드
    lboxImg.src = imgs[idx];
    lbox.style.display = 'flex';
}

function closeLbox() {
    const lbox = document.getElementById('lbox');
    const lboxImg = document.getElementById('lbox-img');
    lbox.style.display = 'none';
    lboxImg.src = ''; // 닫을 때 메모리 해제 보조
}
</script>

</body>
</html>
